name: Update Profile Analytics

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-analytics:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate analytics
        env:
         GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          python scripts/generate_traffic_chart.py

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-analytics.svg
          git add data/traffic.json

          git diff --cached --quiet || git commit -m "chore: update profile analytics"

          git push
