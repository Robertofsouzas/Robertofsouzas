<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura Medalhão: da origem dos dados aos produtos analíticos</title>
  <desc id="desc">Diagrama ilustrativo de uma arquitetura medalhão com fontes de dados, camadas Bronze, Silver e Gold, governança transversal e saídas para dashboards, modelos de machine learning e analytics em tempo real.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071422"/>
      <stop offset="0.5" stop-color="#0a1e2e"/>
      <stop offset="1" stop-color="#101629"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e89a5c"/>
      <stop offset="1" stop-color="#9e4e22"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2f8"/>
      <stop offset="1" stop-color="#7295aa"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd96a"/>
      <stop offset="1" stop-color="#db9f19"/>
    </linearGradient>
    <linearGradient id="governance" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d55c8"/>
      <stop offset="0.5" stop-color="#6f4ebb"/>
      <stop offset="1" stop-color="#b44bb2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#62d2ed"/>
    </marker>
    <marker id="arrowBronze" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e89a5c"/>
    </marker>
    <marker id="arrowSilver" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a9c8d8"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffd96a"/>
    </marker>
    <style>
      .font { font-family: Inter, Aptos, Segoe UI, Arial, sans-serif; }
      .eyebrow { fill: #62d2ed; font-size: 17px; font-weight: 700; letter-spacing: 4px; }
      .title { fill: #f5fbff; font-size: 44px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { fill: #a8c0cf; font-size: 19px; font-weight: 400; }
      .section-label { fill: #77a5b9; font-size: 15px; font-weight: 700; letter-spacing: 2.6px; }
      .card-title { fill: #f2f9fd; font-size: 22px; font-weight: 700; }
      .card-copy { fill: #b7ccda; font-size: 15px; font-weight: 400; }
      .layer-kicker { fill: #d9e9f0; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .layer-name { fill: #ffffff; font-size: 36px; font-weight: 700; }
      .layer-desc { fill: #e4f0f6; font-size: 15px; font-weight: 400; }
      .chip { fill: #d8ebf4; font-size: 13px; font-weight: 600; }
      .small { fill: #9bb8c7; font-size: 13px; font-weight: 400; }
      .output-title { fill: #f4fbff; font-size: 19px; font-weight: 700; }
      .output-copy { fill: #adcad7; font-size: 13px; font-weight: 400; }
      .flow { fill: none; stroke-width: 3; stroke-dasharray: 9 15; animation: dataFlow 1.7s linear infinite; }
      .flow-slow { fill: none; stroke-width: 3; stroke-dasharray: 8 18; animation: dataFlow 2.3s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      .float { transform-box: fill-box; transform-origin: center; animation: float 3.6s ease-in-out infinite; }
      .float-late { transform-box: fill-box; transform-origin: center; animation: float 3.6s ease-in-out 0.8s infinite; }
      @keyframes dataFlow { to { stroke-dashoffset: -48; } }
      @keyframes pulse { 0%, 100% { opacity: .65; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .flow-slow, .pulse, .float, .float-late { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g opacity=".13" stroke="#69d5ef" stroke-width="1">
    <path d="M0 128H1920M0 278H1920M0 918H1920"/>
    <path d="M40 0V1080M380 0V1080M795 0V1080M1205 0V1080M1615 0V1080M1880 0V1080"/>
  </g>
  <g fill="none" stroke="#4fd6f0" opacity=".13">
    <circle cx="1680" cy="130" r="220"/><circle cx="1680" cy="130" r="176"/><circle cx="1680" cy="130" r="132"/>
    <circle cx="120" cy="1000" r="210"/><circle cx="120" cy="1000" r="160"/>
  </g>

  <!-- Header -->
  <g class="font">
    <text x="74" y="90" class="eyebrow">ARQUITETURA DE DADOS · LAKEHOUSE</text>
    <text x="74" y="148" class="title">Arquitetura Medalhão</text>
    <text x="74" y="182" class="subtitle">Dados confiáveis percorrem um caminho de qualidade — da ingestão aos produtos que aceleram decisões.</text>
    <g transform="translate(1635 78)">
      <rect width="210" height="50" rx="25" fill="#12344a" stroke="#2b6b84"/>
      <circle cx="28" cy="25" r="8" fill="#69e1ad" class="pulse"/>
      <text x="48" y="31" fill="#b8e4d0" font-size="15" font-weight="700">DATA PRODUCTS</text>
    </g>
  </g>

  <!-- Column headings -->
  <g class="font">
    <text x="74" y="260" class="section-label">01 · DATA SOURCES</text>
    <text x="465" y="260" class="section-label">02 · MEDALLION CORE</text>
    <text x="1630" y="260" class="section-label">03 · BUSINESS OUTCOMES</text>
  </g>

  <!-- Source cards -->
  <g class="font" filter="url(#cardShadow)">
    <g class="float">
      <rect x="74" y="300" width="278" height="126" rx="18" fill="#102a3a" stroke="#2a5266"/>
      <rect x="74" y="300" width="7" height="126" rx="3.5" fill="#62d2ed"/>
      <!-- spreadsheet icon -->
      <rect x="104" y="329" width="47" height="52" rx="5" fill="#1e728c"/>
      <path d="M115 342h25M115 354h25M115 366h25M123 336v37M132 336v37" stroke="#c7f3ff" stroke-width="2" opacity=".9"/>
      <text x="174" y="347" class="card-title">Planilhas</text>
      <text x="174" y="374" class="card-copy">CSV · Excel · Google Sheets</text>
      <text x="174" y="397" class="small">Dados de negócio e operação</text>
    </g>
    <g class="float-late">
      <rect x="74" y="465" width="278" height="126" rx="18" fill="#102a3a" stroke="#2a5266"/>
      <rect x="74" y="465" width="7" height="126" rx="3.5" fill="#62d2ed"/>
      <!-- database icon -->
      <ellipse cx="128" cy="497" rx="25" ry="10" fill="#1e728c"/>
      <path d="M103 497v38c0 13 50 13 50 0v-38M103 516c0 13 50 13 50 0" fill="#1e728c" stroke="#c7f3ff" stroke-width="2"/>
      <text x="174" y="512" class="card-title">Bancos de dados</text>
      <text x="174" y="539" class="card-copy">ERP · CRM · SQL / NoSQL</text>
      <text x="174" y="562" class="small">Transações e cadastros</text>
    </g>
    <g class="float">
      <rect x="74" y="630" width="278" height="126" rx="18" fill="#102a3a" stroke="#2a5266"/>
      <rect x="74" y="630" width="7" height="126" rx="3.5" fill="#62d2ed"/>
      <!-- API icon -->
      <path d="M104 672h17m-8-8v17M135 664l13 8-13 8" fill="none" stroke="#6be0f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="174" y="677" class="card-title">APIs &amp; eventos</text>
      <text x="174" y="704" class="card-copy">SaaS · IoT · Webhooks · Kafka</text>
      <text x="174" y="727" class="small">Sinais em lote e tempo real</text>
    </g>
  </g>

  <!-- Source aggregation rail -->
  <g class="font">
    <path d="M352 363H405V525H440" class="flow" stroke="#62d2ed" marker-end="url(#arrowBlue)"/>
    <path d="M352 528H405" class="flow" stroke="#62d2ed"/>
    <path d="M352 693H405V525" class="flow" stroke="#62d2ed"/>
    <circle cx="405" cy="525" r="14" fill="#123e54" stroke="#62d2ed" stroke-width="2" class="pulse"/>
    <text x="368" y="812" class="small">ingestão</text>
    <text x="368" y="833" class="small">batch + stream</text>
  </g>

  <!-- Pipeline connectors behind layers -->
  <path d="M780 525H828" class="flow" stroke="#e89a5c" marker-end="url(#arrowBronze)"/>
  <path d="M1190 525H1238" class="flow" stroke="#a9c8d8" marker-end="url(#arrowSilver)"/>
  <path d="M1600 525H1620" class="flow" stroke="#ffd96a" marker-end="url(#arrowGold)"/>

  <!-- Bronze -->
  <g class="font" filter="url(#cardShadow)">
    <rect x="450" y="300" width="330" height="455" rx="24" fill="#1b2b32" stroke="#97512d" stroke-width="2"/>
    <rect x="450" y="300" width="330" height="112" rx="24" fill="url(#bronze)"/>
    <rect x="450" y="388" width="330" height="24" fill="url(#bronze)"/>
    <circle cx="496" cy="350" r="24" fill="#fff1df" opacity=".26"/>
    <path d="M485 350h22M496 339v22" stroke="#fff7ec" stroke-width="3" stroke-linecap="round"/>
    <text x="536" y="340" class="layer-kicker">CAMADA 01</text>
    <text x="536" y="380" class="layer-name">BRONZE</text>
    <text x="480" y="453" class="layer-desc">Dados como chegaram da origem.</text>
    <g>
      <rect x="480" y="484" width="270" height="43" rx="11" fill="#263c43"/>
      <circle cx="501" cy="505" r="5" fill="#e89a5c"/>
      <text x="518" y="510" class="chip">Ingestão bruta e rastreável</text>
      <rect x="480" y="540" width="270" height="43" rx="11" fill="#263c43"/>
      <circle cx="501" cy="561" r="5" fill="#e89a5c"/>
      <text x="518" y="566" class="chip">Histórico imutável</text>
      <rect x="480" y="596" width="270" height="43" rx="11" fill="#263c43"/>
      <circle cx="501" cy="617" r="5" fill="#e89a5c"/>
      <text x="518" y="622" class="chip">Schema-on-read</text>
    </g>
    <path d="M480 685H750" stroke="#8d5b42" opacity=".55"/>
    <text x="480" y="717" class="small">Objetivo · preservar a verdade da fonte</text>
  </g>

  <!-- Silver -->
  <g class="font" filter="url(#cardShadow)">
    <rect x="860" y="300" width="330" height="455" rx="24" fill="#172d38" stroke="#7595a6" stroke-width="2"/>
    <rect x="860" y="300" width="330" height="112" rx="24" fill="url(#silver)"/>
    <rect x="860" y="388" width="330" height="24" fill="url(#silver)"/>
    <circle cx="906" cy="350" r="24" fill="#183c51" opacity=".24"/>
    <path d="M895 350h22M906 339v22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="946" y="340" fill="#31576d" font-size="14" font-weight="700" letter-spacing="2">CAMADA 02</text>
    <text x="946" y="380" fill="#173449" font-size="36" font-weight="700">SILVER</text>
    <text x="890" y="453" class="layer-desc">Dados limpos, validados e conectados.</text>
    <g>
      <rect x="890" y="484" width="270" height="43" rx="11" fill="#243f4b"/>
      <circle cx="911" cy="505" r="5" fill="#b8deee"/>
      <text x="928" y="510" class="chip">Qualidade e deduplicação</text>
      <rect x="890" y="540" width="270" height="43" rx="11" fill="#243f4b"/>
      <circle cx="911" cy="561" r="5" fill="#b8deee"/>
      <text x="928" y="566" class="chip">Regras, segurança e PII</text>
      <rect x="890" y="596" width="270" height="43" rx="11" fill="#243f4b"/>
      <circle cx="911" cy="617" r="5" fill="#b8deee"/>
      <text x="928" y="622" class="chip">Entidades integradas</text>
    </g>
    <path d="M890 685H1160" stroke="#6d95a6" opacity=".55"/>
    <text x="890" y="717" class="small">Objetivo · criar confiança e contexto</text>
  </g>

  <!-- Gold -->
  <g class="font" filter="url(#cardShadow)">
    <rect x="1270" y="300" width="330" height="455" rx="24" fill="#26301f" stroke="#bf8b26" stroke-width="2"/>
    <rect x="1270" y="300" width="330" height="112" rx="24" fill="url(#gold)"/>
    <rect x="1270" y="388" width="330" height="24" fill="url(#gold)"/>
    <circle cx="1316" cy="350" r="24" fill="#8a5f00" opacity=".20"/>
    <path d="M1305 350h22M1316 339v22" stroke="#fff8e3" stroke-width="3" stroke-linecap="round"/>
    <text x="1356" y="340" fill="#72500b" font-size="14" font-weight="700" letter-spacing="2">CAMADA 03</text>
    <text x="1356" y="380" fill="#503705" font-size="36" font-weight="700">GOLD</text>
    <text x="1300" y="453" class="layer-desc">Dados prontos para gerar valor.</text>
    <g>
      <rect x="1300" y="484" width="270" height="43" rx="11" fill="#35412a"/>
      <circle cx="1321" cy="505" r="5" fill="#ffd96a"/>
      <text x="1338" y="510" class="chip">Métricas certificadas</text>
      <rect x="1300" y="540" width="270" height="43" rx="11" fill="#35412a"/>
      <circle cx="1321" cy="561" r="5" fill="#ffd96a"/>
      <text x="1338" y="566" class="chip">Data marts e feature sets</text>
      <rect x="1300" y="596" width="270" height="43" rx="11" fill="#35412a"/>
      <circle cx="1321" cy="617" r="5" fill="#ffd96a"/>
      <text x="1338" y="622" class="chip">Consumo self-service</text>
    </g>
    <path d="M1300 685H1570" stroke="#c99a39" opacity=".55"/>
    <text x="1300" y="717" class="small">Objetivo · ativar decisão e inovação</text>
  </g>

  <!-- Output cards -->
  <g class="font" filter="url(#cardShadow)">
    <g class="float-late">
      <rect x="1630" y="300" width="216" height="126" rx="18" fill="#102a3a" stroke="#2a5266"/>
      <circle cx="1664" cy="343" r="19" fill="#20576d"/>
      <!-- dashboard icon -->
      <rect x="1653" y="333" width="22" height="19" rx="2" fill="none" stroke="#9beeff" stroke-width="2"/>
      <path d="M1658 348v-6m6 6v-10m6 10v-3" stroke="#9beeff" stroke-width="2"/>
      <text x="1696" y="342" class="output-title">Dashboards</text>
      <text x="1696" y="367" class="output-copy">KPIs e relatórios</text>
      <text x="1696" y="389" class="output-copy">decisões guiadas</text>
    </g>
    <g class="float">
      <rect x="1630" y="465" width="216" height="126" rx="18" fill="#102a3a" stroke="#2a5266"/>
      <circle cx="1664" cy="508" r="19" fill="#6c4da2"/>
      <!-- ML icon -->
      <circle cx="1658" cy="502" r="4" fill="#e5c9ff"/><circle cx="1671" cy="498" r="4" fill="#e5c9ff"/><circle cx="1668" cy="516" r="4" fill="#e5c9ff"/>
      <path d="M1661 501l7-2m-8 5l7 10m4-12l-3 11" stroke="#e5c9ff" stroke-width="2"/>
      <text x="1696" y="507" class="output-title">ML Models</text>
      <text x="1696" y="532" class="output-copy">predições e IA</text>
      <text x="1696" y="554" class="output-copy">feature engineering</text>
    </g>
    <g class="float-late">
      <rect x="1630" y="630" width="216" height="126" rx="18" fill="#102a3a" stroke="#2a5266"/>
      <circle cx="1664" cy="673" r="19" fill="#1a786f"/>
      <!-- streaming icon -->
      <path d="M1652 677c4-10 8 10 12 0s8 10 12 0" fill="none" stroke="#9dfff1" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M1652 668c4-10 8 10 12 0s8 10 12 0" fill="none" stroke="#9dfff1" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
      <text x="1696" y="672" class="output-title">Streaming</text>
      <text x="1696" y="697" class="output-copy">Analytics em tempo</text>
      <text x="1696" y="719" class="output-copy">real e alertas</text>
    </g>
  </g>

  <!-- Branching from gold -->
  <path d="M1600 525H1616V363H1630" class="flow-slow" stroke="#ffd96a" marker-end="url(#arrowGold)"/>
  <path d="M1600 525H1630" class="flow-slow" stroke="#ffd96a" marker-end="url(#arrowGold)"/>
  <path d="M1600 525H1616V693H1630" class="flow-slow" stroke="#ffd96a" marker-end="url(#arrowGold)"/>

  <!-- Governance ribbon -->
  <g class="font" filter="url(#cardShadow)">
    <rect x="450" y="826" width="1150" height="112" rx="22" fill="#17243b" stroke="#5b54a7"/>
    <rect x="450" y="826" width="14" height="112" rx="7" fill="url(#governance)"/>
    <g transform="translate(500 858)">
      <circle cx="22" cy="22" r="22" fill="#514cc0"/>
      <path d="M22 9l12 5v9c0 9-6 14-12 17-6-3-12-8-12-17v-9z" fill="none" stroke="#e8e7ff" stroke-width="2"/>
      <text x="60" y="18" fill="#f0f1ff" font-size="17" font-weight="700">Governança &amp; Observabilidade</text>
      <text x="60" y="42" fill="#b9c5df" font-size="14">Uma fundação contínua para todos os dados e camadas</text>
    </g>
    <g transform="translate(940 850)">
      <rect width="132" height="58" rx="14" fill="#202d4a"/>
      <text x="66" y="25" text-anchor="middle" class="chip">CATÁLOGO</text>
      <text x="66" y="45" text-anchor="middle" class="small">linhagem</text>
      <rect x="150" width="132" height="58" rx="14" fill="#202d4a"/>
      <text x="216" y="25" text-anchor="middle" class="chip">QUALIDADE</text>
      <text x="216" y="45" text-anchor="middle" class="small">SLA &amp; testes</text>
      <rect x="300" width="132" height="58" rx="14" fill="#202d4a"/>
      <text x="366" y="25" text-anchor="middle" class="chip">SEGURANÇA</text>
      <text x="366" y="45" text-anchor="middle" class="small">acesso &amp; PII</text>
      <rect x="450" width="132" height="58" rx="14" fill="#202d4a"/>
      <text x="516" y="25" text-anchor="middle" class="chip">FINOPS</text>
      <text x="516" y="45" text-anchor="middle" class="small">custo &amp; escala</text>
    </g>
  </g>

  <!-- Footer process explanation -->
  <g class="font">
    <path d="M74 974H1846" stroke="#234354"/>
    <circle cx="92" cy="1013" r="7" fill="#e89a5c"/>
    <text x="109" y="1019" class="small">BRONZE · captura sem perda</text>
    <circle cx="507" cy="1013" r="7" fill="#b8deee"/>
    <text x="524" y="1019" class="small">SILVER · confiança e integração</text>
    <circle cx="962" cy="1013" r="7" fill="#ffd96a"/>
    <text x="979" y="1019" class="small">GOLD · dados acionáveis</text>
    <text x="1846" y="1019" text-anchor="end" fill="#6e91a1" font-size="13" font-weight="700" letter-spacing="2">RAW → TRUSTED → BUSINESS-READY</text>
  </g>
</svg>
